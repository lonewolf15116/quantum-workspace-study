name: P002 circuit graph baseline smoke
on:
  push:
    paths:
      - 'scripts/run_p002_graph_baseline.py'
      - '.github/workflows/p002-graph-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/reassemble_evidence.py
      - run: python -m py_compile scripts/run_p002_graph_baseline.py
      - run: python scripts/generate_p002_data.py --smoke --out p002_graph_smoke_data
      - run: python scripts/run_p002_graph_baseline.py --smoke --device cpu --data p002_graph_smoke_data --out p002_graph_smoke_results --arm K --seed 202
      - run: python -c "import json; from pathlib import Path; p=Path('p002_graph_smoke_results'); assert json.loads((p/'summary.json').read_text())['status']=='completed'; assert len((p/'steps.jsonl').read_text().splitlines())==2; print('GRAPH_SMOKE_PASS')"
