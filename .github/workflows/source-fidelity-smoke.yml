name: Exact model source-fidelity CPU smoke
on:
  push:
    paths:
      - 'scripts/bench_archived_model_d128.py'
      - '.github/workflows/source-fidelity-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/reassemble_evidence.py
      - run: python scripts/bench_archived_model_d128.py --device cpu --steps 1
